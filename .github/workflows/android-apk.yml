name: MVG Android APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          test -f "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms/android-36/android.jar"
          test -x "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0/aapt2"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare optional stable signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MVG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mvg-stable-signing.jks"
            chmod 600 "$RUNNER_TEMP/mvg-stable-signing.jks"
            echo "MVG_SIGNING_KEYSTORE=$RUNNER_TEMP/mvg-stable-signing.jks" >> "$GITHUB_ENV"
            echo "Stable signing configured from GitHub Secrets"
          else
            echo "No stable signing configured; using ephemeral Android debug signing"
          fi
      - name: Unit tests and APK build
        env:
          MVG_KEYSTORE_PASSWORD: ${{ secrets.MVG_KEYSTORE_PASSWORD }}
          MVG_KEY_ALIAS: ${{ secrets.MVG_KEY_ALIAS }}
          MVG_KEY_PASSWORD: ${{ secrets.MVG_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify APK signature and publish OAuth SHA-1
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk | tee \
            app/build/outputs/apk/debug/MVG_SIGNING_FINGERPRINTS.txt
          grep -q "SHA-1 digest" app/build/outputs/apk/debug/MVG_SIGNING_FINGERPRINTS.txt
      - name: APK file checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MVG-v0.5.0-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/MVG_SIGNING_FINGERPRINTS.txt
          if-no-files-found: error
          retention-days: 30
