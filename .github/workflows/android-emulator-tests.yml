name: MVG Android emulator backup tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/src/androidTest/**'
      - '.github/workflows/android-emulator-tests.yml'

permissions:
  contents: read

jobs:
  android-backup-instrumentation:
    name: Android emulator FileProvider backup / restore test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM acceleration
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Android emulator backup / restore tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            sdkmanager "platforms;android-36" "build-tools;36.0.0"
            gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace
      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MVG-Android-Emulator-Test-Results
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore
          retention-days: 14
